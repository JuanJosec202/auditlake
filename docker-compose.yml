name: auditlake

# Compose base: sin puertos publicados, así varios proyectos (dev, demo, bench) conviven en el mismo host
# con datos separados. Los puertos de desarrollo están en docker-compose.dev.yml:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# Demo (proyecto aislado, sin pasos previos):
#   docker compose -p auditlake-demo -f docker-compose.yml --env-file .env.example run --build --rm spark python -m auditlake.demo
# Sin .env se usan credenciales de demo solo para este entorno local; un .env (copia de .env.example) las reemplaza.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU20-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-AuditLake_Demo_2026!}
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: src/AuditLake.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ApplyMigrationsOnStartup: "true"
      Audit__Sink: ${AUDIT_SINK:-Outbox}   # LegacyTable solo para el benchmark complementario
      ConnectionStrings__AuditLake: "Server=sqlserver,1433;Database=AuditLake;User Id=sa;Password=${MSSQL_SA_PASSWORD:-AuditLake_Demo_2026!};TrustServerCertificate=True"
    volumes:
      - applogs:/app/logs         # hiper-logs Serilog (CLEF); los lee log_ingest
    depends_on:
      sqlserver:
        condition: service_healthy

  minio:
    # MinIO ya no publica imágenes: se compila desde el tag fijado (docker/minio/Dockerfile).
    build: docker/minio
    image: auditlake-minio:RELEASE.2025-10-15T17-29-55Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-auditlake}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-AuditLake_Demo_Minio1}
    # Sin puertos publicados: solo se usa dentro de la red de Compose (9000/9001 suelen estar ocupados).
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: amazon/aws-cli:2.22.35
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-auditlake}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-AuditLake_Demo_Minio1}
      AWS_REGION: us-east-1
    entrypoint: ["sh", "-c", "aws --endpoint-url http://minio:9000 s3api head-bucket --bucket warehouse 2>/dev/null || aws --endpoint-url http://minio:9000 s3 mb s3://warehouse"]
    depends_on:
      minio:
        condition: service_healthy

  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.8.1
    environment:
      # El catálogo vive en SQLite dentro de un volumen: sobrevive a reinicios (por defecto es en memoria).
      # busy_timeout: con lecturas y commits concurrentes SQLite devolvía SQLITE_BUSY (500 en el commit).
      # WAL lo empeoró (SQLITE_BUSY_SNAPSHOT con el pool de conexiones del catálogo), por eso no se usa.
      CATALOG_URI: jdbc:sqlite:/home/iceberg/catalog.db?journal_mode=DELETE&busy_timeout=10000
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-auditlake}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-AuditLake_Demo_Minio1}
      AWS_REGION: us-east-1
    volumes:
      - catalog:/home/iceberg
    depends_on:
      minio-init:
        condition: service_completed_successfully

  spark:
    # Job manual y en serie: docker compose run --rm spark python -m auditlake.main
    build: docker/spark
    image: auditlake-spark:3.5.4-iceberg1.7.1
    profiles: ["jobs"]
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-auditlake}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-AuditLake_Demo_Minio1}
      AWS_REGION: us-east-1
      OUTBOX_JDBC_URL: "jdbc:sqlserver://sqlserver:1433;databaseName=AuditLake;encrypt=true;trustServerCertificate=true"
      OUTBOX_USER: sa
      OUTBOX_PASSWORD: ${MSSQL_SA_PASSWORD:-AuditLake_Demo_2026!}
      OUTBOX_BATCH_SIZE: "1000"
      OUTBOX_READ_HINT: ${OUTBOX_READ_HINT-READPAST}
      API_URL: http://api:8080
    volumes:
      - ./pipelines:/app
      - ./dbt:/dbt
      - applogs:/data/logs
      - spark-checkpoints:/data/checkpoints
      - ./conf/local/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./conf/local/maintenance.json:/opt/spark/conf/maintenance.json:ro
      - ./sql:/sql:ro
    depends_on:
      sqlserver:
        condition: service_healthy
      iceberg-rest:
        condition: service_started
      api:
        condition: service_started

volumes:
  sqldata:
  miniodata:
  catalog:
  spark-checkpoints:
  applogs:
