# Catálogo local: Iceberg REST + MinIO. En conf/aws solo cambia este archivo (GlueCatalog + S3).
spark.master                                   local[*]
spark.sql.session.timeZone                     UTC
spark.sql.extensions                           org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.defaultCatalog                       lake
spark.sql.catalog.lake                         org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lake.type                    rest
spark.sql.catalog.lake.uri                     http://iceberg-rest:8181
spark.sql.catalog.lake.warehouse               s3://warehouse/
spark.sql.catalog.lake.io-impl                 org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lake.s3.endpoint             http://minio:9000
spark.sql.catalog.lake.s3.path-style-access    true
spark.ui.enabled                               false

# Detección rápida de indisponibilidad (objetivo local: <= 60 s desde el primer acceso al catálogo).
# Sin esto, un GET al catálogo esperaba ~170 s (timeout de socket por defecto) mientras el servidor REST
# reintentaba leer los metadatos en S3, y el segundo GET (registro de la corrida fallida) otros ~156 s.
spark.sql.catalog.lake.rest.client.connection-timeout-ms   5000
spark.sql.catalog.lake.rest.client.socket-timeout-ms       20000
spark.sql.catalog.lake.rest.client.max-retries             2
spark.sql.catalog.lake.s3.retry.num-retries                2
spark.sql.catalog.lake.s3.retry.min-wait-ms                500
spark.sql.catalog.lake.s3.retry.max-wait-ms                2000

# El catálogo de sesión (spark_catalog) no se usa, pero Spark crea su Derby en el cwd: mandarlo a /tmp.
spark.driver.extraJavaOptions                  -Dderby.system.home=/tmp/derby

# Lectura vectorizada de Iceberg (Arrow) desactivada: con ~1M de filas la JVM caía con SIGSEGV (GC/clases
# corruptas) en Java 11.0.25 y también en Java 17.0.13; sin vectorización la misma consulta es estable.
spark.sql.iceberg.vectorization.enabled         false
