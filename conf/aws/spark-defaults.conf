# Referencia para AWS (NO EJECUTADA): mismo código que conf/local, cambian catálogo y almacenamiento.
#   Catálogo: AWS Glue Data Catalog (GlueCatalog) en lugar de Iceberg REST.
#   Almacenamiento: Amazon S3 en lugar de MinIO (sin endpoint ni path-style; credenciales del rol IAM del job).
# En un Glue Job estas propiedades se pasan como parámetro --conf (ver conf/aws/glue-job.json); este archivo
# sirve tal cual para spark-submit en EMR o para una prueba manual. Reemplazar <bucket>.
spark.sql.session.timeZone                     UTC
spark.sql.extensions                           org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.defaultCatalog                       lake
spark.sql.catalog.lake                         org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lake.catalog-impl            org.apache.iceberg.aws.glue.GlueCatalog
spark.sql.catalog.lake.warehouse               s3://<bucket>/warehouse/
spark.sql.catalog.lake.io-impl                 org.apache.iceberg.aws.s3.S3FileIO
# En local se desactivó por un SIGSEGV con ~1M de filas (docs/design.md §9); en el runtime de Glue 5 se
# deja desactivado hasta revalidarlo allí.
spark.sql.iceberg.vectorization.enabled        false
