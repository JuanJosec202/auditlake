name: auditlake
version: "1.0.0"
config-version: 2
profile: auditlake
model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "/tmp/dbt-target"
log-path: "/tmp/dbt-logs"
packages-install-path: "/tmp/dbt-packages"

models:
  auditlake:
    +materialized: view
    +file_format: iceberg
    silver:
      +schema: silver
    gold:
      +schema: gold

data_tests:
  auditlake:
    +file_format: iceberg
